name: CI Parallelism Benchmark

# Manual-only experiment for issue #212. Never adds work to ordinary PR/push CI.
on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions: {}

jobs:
  benchmark:
    # Execute automatically only for this issue's benchmark PR; manual dispatch remains available later.
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'perf/212-ci-timing-baseline'
    name: benchmark-${{ matrix.os }}-workers-${{ matrix.workers }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            workers: 1
          - os: ubuntu-latest
            workers: 2
          - os: ubuntu-latest
            workers: 4
          - os: windows-latest
            workers: 1
          - os: windows-latest
            workers: 2
          - os: windows-latest
            workers: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install pytest-xdist for parallel trials
        if: matrix.workers != 1
        run: python -m pip install pytest-xdist

      - name: Run serial suite with coverage
        if: runner.os == 'Linux' && matrix.workers == 1
        run: |
          set -o pipefail
          pytest tests/ --durations=30 --cov --cov-report=term --cov-report=xml --cov-report=json | tee pytest_output.txt

      - name: Run 2-worker suite with coverage
        if: runner.os == 'Linux' && matrix.workers == 2
        run: |
          set -o pipefail
          pytest tests/ -n 2 --dist=loadfile --durations=30 --cov --cov-report=term --cov-report=xml --cov-report=json | tee pytest_output.txt

      - name: Run 4-worker suite with coverage
        if: runner.os == 'Linux' && matrix.workers == 4
        run: |
          set -o pipefail
          pytest tests/ -n 4 --dist=loadfile --durations=30 --cov --cov-report=term --cov-report=xml --cov-report=json | tee pytest_output.txt

      - name: Verify checked-in test count
        if: runner.os == 'Linux'
        run: python scripts/check_test_count.py pytest_output.txt

      - name: Enforce coverage floors
        if: runner.os == 'Linux'
        run: python scripts/check_coverage.py coverage.json

      - name: Enforce changed-line coverage
        if: runner.os == 'Linux'
        run: diff-cover coverage.xml --config-file pyproject.toml

      - name: Upload Linux benchmark records
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: benchmark-${{ matrix.os }}-workers-${{ matrix.workers }}
          path: |
            pytest_output.txt
            coverage.xml
            coverage.json
          if-no-files-found: warn
          retention-days: 30

      - name: Run serial suite on Windows
        if: runner.os == 'Windows' && matrix.workers == 1
        shell: pwsh
        run: |
          pytest tests/ --durations=30 | Tee-Object -FilePath pytest_output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run 2-worker suite on Windows
        if: runner.os == 'Windows' && matrix.workers == 2
        shell: pwsh
        run: |
          pytest tests/ -n 2 --dist=loadfile --durations=30 | Tee-Object -FilePath pytest_output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run 4-worker suite on Windows
        if: runner.os == 'Windows' && matrix.workers == 4
        shell: pwsh
        run: |
          pytest tests/ -n 4 --dist=loadfile --durations=30 | Tee-Object -FilePath pytest_output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows benchmark records
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: benchmark-${{ matrix.os }}-workers-${{ matrix.workers }}
          path: pytest_output.txt
          if-no-files-found: warn
          retention-days: 30
