name: CI Parallelism Benchmark

# Manual-only measurement of how long the full test suite takes with 1, 2 and 4 pytest-xdist workers on Ubuntu
# (with coverage) and Windows, so CI's worker counts can be chosen again as the suite grows. Issue #212 chose the
# current ones (`-n 4` on Ubuntu, `-n 2` on Windows) from this workflow; the last baseline is its results comment:
# https://github.com/ShamikM88/open-cam-framework/issues/212#issuecomment-6103574890
#
# - Never a gate: it runs only when started by hand (workflow_dispatch), never on a pull request or a push, and it
#   is not a required check. Its result is evidence for a decision, not a pass or a fail.
# - Cost: one dispatch is 18 jobs (2 operating systems x 3 worker counts x 3 repeats), at most 6 at a time.
# - Run it on main, or on a branch whose CI is green and whose badges/test-count.json is current. The Linux jobs
#   also run the test-count, coverage-floor and changed-line coverage checks; a failure there says nothing about
#   speed.
# - Read pytest's own elapsed time (each job's summary table, or the last line of its pytest_output.txt
#   artifact), not the job's duration, which includes queueing and setup.
# - Compare the median of the three repeats of each configuration, never single runs. In #212 the fastest and
#   slowest of three runs of one configuration differed by up to 45%, because the jobs share hosted runners, so
#   treat medians as directional.
# - Every job should report the same passed and xfailed counts and, on Ubuntu, the same coverage total; if not,
#   the runs did not run the same tests and their timings are not comparable.
# - Keep the pytest commands in step with ci.yml (tests/test_ci_workflow.py pins both), and point the baseline
#   link above at the new results when CI's worker counts change.
# Procedure and decision rule: docs/operations.md, "Re-tuning test parallelism".
on:
  workflow_dispatch:

permissions: {}

jobs:
  benchmark:
    name: benchmark-${{ matrix.os }}-workers-${{ matrix.workers }}-repeat-${{ matrix.repeat }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: [ubuntu-latest, windows-latest]
        workers: [1, 2, 4]
        repeat: [1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run serial suite with coverage
        if: runner.os == 'Linux' && matrix.workers == 1
        run: |
          set -o pipefail
          pytest tests/ --durations=30 --cov --cov-report=term --cov-report=xml --cov-report=json | tee pytest_output.txt

      - name: Run 2-worker suite with coverage
        if: runner.os == 'Linux' && matrix.workers == 2
        run: |
          set -o pipefail
          pytest tests/ -n 2 --dist=loadfile --durations=30 --cov --cov-report=term --cov-report=xml --cov-report=json | tee pytest_output.txt

      - name: Run 4-worker suite with coverage
        if: runner.os == 'Linux' && matrix.workers == 4
        run: |
          set -o pipefail
          pytest tests/ -n 4 --dist=loadfile --durations=30 --cov --cov-report=term --cov-report=xml --cov-report=json | tee pytest_output.txt

      - name: Verify checked-in test count
        if: runner.os == 'Linux'
        run: python scripts/check_test_count.py pytest_output.txt

      - name: Enforce coverage floors
        if: runner.os == 'Linux'
        run: python scripts/check_coverage.py coverage.json

      - name: Enforce changed-line coverage
        if: runner.os == 'Linux'
        run: diff-cover coverage.xml --config-file pyproject.toml

      - name: Upload Linux benchmark records
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: benchmark-${{ matrix.os }}-workers-${{ matrix.workers }}-repeat-${{ matrix.repeat }}
          path: |
            pytest_output.txt
            coverage.xml
            coverage.json
          if-no-files-found: warn
          retention-days: 30

      - name: Run serial suite on Windows
        if: runner.os == 'Windows' && matrix.workers == 1
        shell: pwsh
        run: |
          pytest tests/ --durations=30 | Tee-Object -FilePath pytest_output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run 2-worker suite on Windows
        if: runner.os == 'Windows' && matrix.workers == 2
        shell: pwsh
        run: |
          pytest tests/ -n 2 --dist=loadfile --durations=30 | Tee-Object -FilePath pytest_output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run 4-worker suite on Windows
        if: runner.os == 'Windows' && matrix.workers == 4
        shell: pwsh
        run: |
          pytest tests/ -n 4 --dist=loadfile --durations=30 | Tee-Object -FilePath pytest_output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows benchmark records
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: benchmark-${{ matrix.os }}-workers-${{ matrix.workers }}-repeat-${{ matrix.repeat }}
          path: pytest_output.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Write the timing to the job summary
        if: always()
        shell: python
        env:
          BENCHMARK_OS: ${{ matrix.os }}
          BENCHMARK_WORKERS: ${{ matrix.workers }}
          BENCHMARK_REPEAT: ${{ matrix.repeat }}
        run: |
          # One table row per job on the run page, so the 18 results can be compared without downloading
          # artifacts. A missing log or summary line is written into the row, never raised.
          import os
          import re
          from pathlib import Path

          log = Path("pytest_output.txt")
          raw = log.read_bytes() if log.is_file() else b""
          # tee and current pwsh write UTF-8; an older PowerShell Tee-Object writes UTF-16 with a BOM. Only the
          # summary line's figures are read, so an undecodable byte elsewhere in the log may be replaced.
          if raw[:2] in (b"\xff\xfe", b"\xfe\xff"):
              text = raw.decode("utf-16")
          else:
              text = raw.decode("utf-8", errors="replace")
          results = re.findall(r"^=+ (.+?) in ([0-9.]+)s\b.*=+\s*$", text, re.M)
          totals = re.findall(r"^TOTAL\s.*?(\d+(?:\.\d+)?%)\s*$", text, re.M)
          result, seconds = results[-1] if results else ("no pytest summary line in pytest_output.txt", "n/a")
          coverage = totals[-1] if totals else "n/a"
          row = (os.environ["BENCHMARK_OS"], os.environ["BENCHMARK_WORKERS"], os.environ["BENCHMARK_REPEAT"],
                 seconds, coverage, result)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("| OS | Workers | Repeat | pytest elapsed (s) | Coverage total | Result |\n")
              summary.write("| :--- | ---: | ---: | ---: | ---: | :--- |\n")
              summary.write("| " + " | ".join(row) + " |\n")
