name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: ruff check . --select=E9,F63,F7,F82

      - name: Security scan with Bandit
        run: bandit -r scripts/ -lll

      - name: Run test suite
        run: |
          set -o pipefail
          pytest tests/ | tee pytest_output.txt

      - name: Verify checked-in test count
        run: python scripts/check_test_count.py pytest_output.txt
