name: Mutation testing

# Weekly and on demand -- NEVER on a pull request or push (issue #146). Mutation testing changes one line of a
# governance module at a time and checks that some test then fails; a mutant that survives is a line nothing
# really tests. It takes far too long to gate a pull request, and the numbers are advisory: the first full run is
# diagnostic, thresholds are decided from it afterwards, and no result here blocks a merge.
#
# Three modes (issue #435; a full run takes about 102 minutes, so most runs are cheaper):
#   incremental  the weekly default. mutmut keeps a verdict per mutant in mutants/ and, for a function whose source is
#                unchanged, keeps it; the directory is restored from the Actions cache, so only new or changed
#                functions are tested, plus a retest of every recorded survivor so that new tests are credited.
#   full         every mutant from scratch: the first Monday of each month (the schedule), or the `full` input. A
#                cached run cannot see a killed mutant become alive after a test is weakened; this run does.
#   filtered     the `mutants` input: mutmut name globs such as `export_readback.*`, retested even if they already
#                have a verdict. Quick, authoritative check of one module on a pull request branch (run the workflow
#                from that branch).
on:
  schedule:
    - cron: "17 3 * * 1"      # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      mutants:
        description: "Space-separated mutmut name globs to retest, e.g. export_readback.* (empty: the default run)"
        required: false
        default: ""
        type: string
      full:
        description: "Run every mutant from scratch, ignoring the cache"
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: mutation
  cancel-in-progress: false

jobs:
  mutation:
    name: mutation
    runs-on: ubuntu-latest      # mutmut forks; it does not run on Windows
    timeout-minutes: 120        # a full run took about 32 minutes with nine modules in scope and is estimated at about 90 with eleven; a hung run is stopped well before the 360-minute limit
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: |
            requirements-dev.txt
            requirements-mutation.txt
            constraints.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade -c constraints.txt pip==26.2.2
          pip install -c constraints.txt -r requirements-dev.txt -r requirements-mutation.txt

      - name: Expose scripts/ to mutmut as src/
        # The tests import the modules as top-level names; mutmut only understands that layout from src/
        # (see [tool.mutmut] in pyproject.toml). src is git-ignored.
        run: ln -s scripts src

      - name: Decide the run mode
        # The inputs reach the shell only through env, never interpolated into the script, and the name globs are
        # checked against a strict character set before anything uses them.
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          MUTANTS: ${{ inputs.mutants }}
          FULL: ${{ inputs.full }}
        run: |
          set -eu
          mode=incremental
          if [ -n "${MUTANTS:-}" ]; then
            if ! printf '%s' "$MUTANTS" | grep -Eq '^[A-Za-z0-9_.*? ]+$'; then
              echo "::error::the mutants input may contain only letters, digits, underscore, dot, asterisk, question mark and spaces"
              exit 1
            fi
            mode=filtered
          elif [ "${FULL:-false}" = "true" ]; then
            mode=full
          elif [ "$EVENT" = "schedule" ] && [ "$(date -u +%d)" -le 7 ]; then
            mode=full     # the first Monday of the month
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Restore the mutation results
        # A full run starts from nothing. Caches are scoped to the branch (a run from a pull request branch can read
        # the default branch's cache but never writes to it). The key changes with the dependencies and
        # pyproject.toml (mutation scope and test selection), so a change to either starts a fresh full run.
        id: restore
        if: steps.mode.outputs.mode != 'full'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: mutants
          key: mutants-${{ runner.os }}-${{ hashFiles('requirements-dev.txt', 'requirements-mutation.txt', 'constraints.txt', 'pyproject.toml') }}-${{ github.run_id }}
          restore-keys: |
            mutants-${{ runner.os }}-${{ hashFiles('requirements-dev.txt', 'requirements-mutation.txt', 'constraints.txt', 'pyproject.toml') }}-

      - name: Run mutmut
        # What to mutate and which tests to run: [tool.mutmut] in pyproject.toml. A failing exit status here does
        # not stop the report steps below; the final step fails the job only if mutmut produced no result at all.
        id: mutmut
        continue-on-error: true
        timeout-minutes: 110   # a step timeout (below the job's 120), so the report steps below still run when mutmut hangs
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          MUTANTS: ${{ inputs.mutants }}
          RESTORED: ${{ steps.restore.outputs.cache-matched-key }}
        run: |
          set -o pipefail
          case "$MODE" in
            full)
              rm -rf mutants
              mutmut run 2>&1 | tee mutmut-run.log
              ;;
            filtered)
              read -r -a globs <<< "$MUTANTS"
              mutmut run "${globs[@]}" 2>&1 | tee mutmut-run.log
              ;;
            *)
              # New or changed functions first, then every recorded survivor again: a test added since the last run
              # may now kill it. Without a restored cache this is simply a full run.
              mutmut run 2>&1 | tee mutmut-run.log
              if [ -n "${RESTORED:-}" ]; then
                mutmut results | awk '/: survived/ { sub(/:$/, "", $1); print $1 }' > survivors.txt
                if [ -s survivors.txt ]; then
                  mutmut run $(cat survivors.txt) 2>&1 | tee -a mutmut-run.log
                fi
              fi
              ;;
          esac

      - name: Collect results
        if: always()
        env:
          MUTMUT_OUTCOME: ${{ steps.mutmut.outcome }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          mutmut export-cicd-stats || true
          mutmut results > mutation-survivors.txt || true
          mutmut results --all true > mutation-all.txt || true
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, pathlib
          path = pathlib.Path("mutants/mutmut-cicd-stats.json")
          print("## Mutation testing (diagnostic, not a merge gate)")
          print(f"run mode: **{os.environ.get('MODE', 'unknown')}**; "
                f"mutmut step outcome: **{os.environ.get('MUTMUT_OUTCOME', 'unknown')}**")
          if not path.exists():
              print("mutmut produced no statistics; see the run log artifact.")
          else:
              s = json.loads(path.read_text(encoding="utf-8"))
              tested = s["total"] - s["skipped"]
              score = 100.0 * (s["killed"] + s["timeout"]) / tested if tested else 0.0
              print(f"**Mutation score: {score:.1f}%** ({s['killed']} killed, {s['timeout']} timed out, "
                    f"{s['survived']} survived, {s['no_tests']} with no tests, {s['suspicious']} suspicious, "
                    f"{s['skipped']} skipped, of {s['total']})")
          PY
          # Per-module scores, completeness warnings and the largest survivor groups (scripts/mutation_report.py).
          # Diagnostic: it never fails the job over a score.
          if ! python scripts/mutation_report.py mutation-all.txt --json mutation-report.json >> "$GITHUB_STEP_SUMMARY"; then
            echo "The per-module report could not be produced; see mutation-all.txt." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save the mutation results
        if: always() && steps.mode.outputs.mode != 'filtered'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: mutants
          key: mutants-${{ runner.os }}-${{ hashFiles('requirements-dev.txt', 'requirements-mutation.txt', 'constraints.txt', 'pyproject.toml') }}-${{ github.run_id }}

      - name: Record the resolved mutation dependency versions
        if: always()
        run: pip freeze > pip-freeze-mutation.txt

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mutation-report
          path: |
            mutmut-run.log
            pip-freeze-mutation.txt
            mutation-survivors.txt
            mutation-all.txt
            mutation-report.json
            mutants/mutmut-cicd-stats.json
            mutants/src/*.meta
          if-no-files-found: warn
          retention-days: 90

      - name: Fail if mutmut produced no result
        # "Stopping early" (a wrong module path, say) still writes a statistics file, with every mutant unchecked:
        # require that at least one mutant was actually run.
        if: always()
        run: |
          python - <<'PY'
          import json, sys
          try:
              with open("mutants/mutmut-cicd-stats.json", encoding="utf-8") as f:
                  s = json.load(f)
          except (OSError, ValueError) as exc:
              sys.exit(f"no mutation statistics: {exc}")
          # "no_tests" is deliberately NOT counted: a wrong test selection puts every mutant there.
          ran = s["killed"] + s["survived"] + s["timeout"] + s["suspicious"] + s["segfault"]
          if ran == 0:
              sys.exit(f"no mutant was actually tested ({s['no_tests']} had no test) out of {s['total']}; "
                       "see mutmut-run.log")
          PY
