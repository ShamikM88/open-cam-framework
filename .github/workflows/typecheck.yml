name: Type check

# A gate on the eleven governance modules, not one of the ruleset-required checks (issue #424, Phase 3 option B; the
# required question is #527). It runs `mypy` as configured in pyproject.toml ([tool.mypy]) and reports the number of
# type errors per module in the job summary, so a failing run shows exactly which module regressed. It is not one of
# the ruleset-required checks (`test`, `test-windows`, `runtime-smoke`) and is not part of ci.yml.
#
# - Type errors fail the job (issue #424, Phase 3 option B): mypy exits 1 when it finds any, and the step fails with
#   that status after the per-module counts have been written to the job summary.
# - A mypy that cannot run at all (exit status 2 or more: a crash, an unreadable file in `files`, a bad
#   configuration) also fails the job, because a broken check must not look like a clean one.
# - Runs on pull requests that touch the code, the configuration or the pinned tool set, and by hand.
on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "pyproject.toml"
      - "requirements-dev.txt"
      - "constraints.txt"
      - ".github/workflows/typecheck.yml"

permissions: {}

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: |
            requirements-dev.txt
            constraints.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade -c constraints.txt pip==26.2.1
          pip install -c constraints.txt -r requirements-dev.txt

      - name: Run mypy and report the error count per module
        run: |
          status=0
          mypy > mypy_output.txt 2>&1 || status=$?
          cat mypy_output.txt
          errors="$(awk '/^scripts\/[A-Za-z0-9_]+\.py:[0-9]+: error:/ { n++ } END { print n + 0 }' mypy_output.txt)"
          {
            echo "### mypy check (type errors fail this job; not a required check)"
            echo
            echo "mypy exit status $status (0 clean, 1 type errors found, 2 or more mypy could not run): $errors errors."
            echo
            echo '```'
            awk -F: '/^scripts\/[A-Za-z0-9_]+\.py:[0-9]+: error:/ { n[$1]++ } END { for (f in n) print n[f], f }' mypy_output.txt | sort -rn
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ge 1 ]; then
            exit "$status"
          fi
