name: Model freshness report

# Diagnostic only: update the installed SDK's metadata weekly and report findings for deliberate follow-up.
# Never runs on a pull request or push, and is not a required check. Model IDs are never changed automatically.
on:
  schedule:
    - cron: "17 3 * * 1"      # Mondays 03:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: model-freshness
  cancel-in-progress: false

jobs:
  model_freshness:
    name: model-freshness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate the model freshness report
        run: |
          python scripts/check_model_freshness.py --json model-freshness-report.json | tee model-freshness-report.md

      - name: Open or update the single model freshness issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          findings="$(python -c 'import json; print(len(json.load(open("model-freshness-report.json", encoding="utf-8"))["findings"]))')"
          if [ "$findings" = "0" ]; then
            echo "No model freshness findings; no issue created or updated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          export GH_TOKEN="$GITHUB_TOKEN"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search 'in:title "Model freshness report"' --json number,title --limit 100)"
          issue_number="$(printf '%s' "$existing" | jq -r '.[] | select(.title == "Model freshness report") | .number' | head -n 1)"

          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" \
              --body-file model-freshness-report.md --add-label tech-debt
            echo "Updated existing Model freshness report issue #$issue_number." >> "$GITHUB_STEP_SUMMARY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Model freshness report" \
              --label tech-debt --body-file model-freshness-report.md
            echo "Opened Model freshness report issue." >> "$GITHUB_STEP_SUMMARY"
          fi
