name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Least privilege (issue #141): nothing by default; each job grants itself read access to the repository and
# nothing else. No job needs to write to the repository, the pull request or the checks API.
permissions: {}

# A new push to a pull request supersedes the run still going for the previous one. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every third-party action is pinned to a full commit SHA (issue #141); the trailing comment names the release so
# Dependabot can propose the next one. Tool settings (ruff, pytest, coverage floors) live in pyproject.toml.
jobs:
  test:
    name: test
    # Required status check (ruleset "Main Branch Protection", pinned to the GitHub Actions app) -- the job names
    # `test`, `test-windows` and `runtime-smoke` are that contract: renaming one blocks every merge until the
    # ruleset is changed to match. `security` is deliberately not required.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0              # diff-cover needs the base branch to find the lines a pull request changes
          persist-credentials: false  # no later step needs the token

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: |
            requirements-dev.txt
            constraints.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade -c constraints.txt pip==26.2.1
          pip install -c constraints.txt -r requirements-dev.txt

      - name: Lint with Ruff
        run: ruff check .   # rules live in pyproject.toml

      - name: Security scan with Bandit
        run: bandit -r scripts/ -ll

      - name: Run test suite with coverage
        run: |
          set -o pipefail
          pytest tests/ -n 4 --dist=loadfile --durations=30 --cov --cov-report=term --cov-report=xml --cov-report=json | tee pytest_output.txt

      - name: Verify checked-in test count
        run: python scripts/check_test_count.py pytest_output.txt

      - name: Enforce coverage floors
        # Overall and per-governance-module floors: [tool.opencam.coverage] in pyproject.toml.
        run: python scripts/check_coverage.py coverage.json

      - name: Enforce coverage of the lines this pull request changes
        if: github.event_name == 'pull_request'
        # compare_branch and fail_under come from [tool.diff_cover] in pyproject.toml -- but diff-cover reads that
        # file ONLY when told to (--config-file); without it the floor is silently 0 and this step cannot fail
        # (found in review; tests/test_ci_workflow.py runs this exact command against an uncovered change).
        # A change that touches no measured line (tests, docs, workflows only) passes; there is nothing to cover.
        run: diff-cover coverage.xml --config-file pyproject.toml

      - name: Enforce coverage of the lines this pull request changes in the governance modules
        if: github.event_name == 'pull_request'
        # The stricter tier: diff_cover_critical.toml holds the lines changed in the nine governance modules to 98%
        # (the step above holds every changed line to 95%). Same rule about --config-file: without it the floor is
        # silently 0. tests/test_ci_workflow.py runs this exact command against an uncovered change.
        run: diff-cover coverage.xml --config-file diff_cover_critical.toml

      - name: Record the resolved dependency versions
        if: always()
        run: pip freeze > pip-freeze.txt

      - name: Upload coverage and environment records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ci-records-ubuntu
          path: |
            coverage.xml
            coverage.json
            pytest_output.txt
            pip-freeze.txt
          if-no-files-found: warn
          retention-days: 30

  test-windows:
    name: test-windows
    # The framework's primary development platform is Windows (cp1252 console, backslash paths, CRLF checkouts);
    # the UTF-8 policy (issue #137) and the snapshot comparisons exist because of it. Same suite, no coverage.
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: |
            requirements-dev.txt
            constraints.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade -c constraints.txt pip==26.2.1
          pip install -c constraints.txt -r requirements-dev.txt

      - name: Run test suite
        run: pytest tests/ -n 2 --dist=loadfile --durations=30

  runtime-smoke:
    name: runtime-smoke
    # Installs ONLY requirements.txt (no development tools) and checks that every module imports, every CLI
    # prints usage, and a deal exports end to end -- what a user who just cloned the repository gets.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      - name: Install runtime dependencies only
        run: |
          python -m pip install --upgrade -c constraints.txt pip==26.2.1
          pip install -c constraints.txt -r requirements.txt

      - name: Smoke check
        run: python tests/runtime_smoke.py --expect-clean

      - name: Record the resolved dependency versions
        if: always()
        run: pip freeze > pip-freeze-runtime.txt

      - name: Upload environment record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ci-records-runtime
          path: pip-freeze-runtime.txt
          if-no-files-found: warn
          retention-days: 30

  security:
    name: security
    # Known-vulnerable dependencies and unsafe workflow patterns. A new advisory can turn this red on an unrelated
    # pull request; that is the point, and it is why this job is not part of the required checks.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: |
            requirements-security.txt
            constraints.txt

      - name: Install audit tools
        run: |
          python -m pip install --upgrade -c constraints.txt pip==26.2.1
          pip install -c constraints.txt -r requirements-security.txt

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt -r requirements-dev.txt -r requirements-security.txt -r requirements-mutation.txt -r constraints.txt

      - name: Audit workflows
        env:
          GH_TOKEN: ${{ github.token }}   # zizmor's online audits (impostor commits, known-vulnerable actions)
        run: zizmor .github/workflows

      - name: Record the resolved security dependency versions
        if: always()
        run: pip freeze > pip-freeze-security.txt

      - name: Upload security environment record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ci-records-security
          path: pip-freeze-security.txt
          if-no-files-found: warn
          retention-days: 30
