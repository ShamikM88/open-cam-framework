name: New tests on base check (advisory)

# Advisory only (issue #475, option C): runs the tests a pull request adds or changes against the
# base commit and reports whether they fail there, in the job summary. It is not one of the
# ruleset-required checks (`test`, `test-windows`, `runtime-smoke`), is not part of ci.yml, and
# never posts comments. As with the scope check, on a `pull_request` event this job checks out the
# PR's own merge commit and runs scripts/pr_base_fail_check.py from it, so the report is a reviewer
# aid and not a gate or a proof.
#
# - Every verdict exits 0; the step fails (exit 2) only when the check itself is broken, because a
#   broken check must not look like a clean one.
# - Linux only: the verdict is a deterministic property of the base code plus the test.
on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: base-fail-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  base-fail-check:
    name: base-fail-check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history: the script diffs base...merge-commit and checks out the base commit into
          # a worktree, and a shallow checkout would not contain those objects.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: |
            requirements-dev.txt
            constraints.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade -c constraints.txt pip==26.2.2
          pip install -c constraints.txt -r requirements-dev.txt

      - name: Collect changed-file list
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --name-only --no-renames -z "$BASE_SHA...$GITHUB_SHA" > changed-files.nul

      - name: Run the PR's new or changed tests on the base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python scripts/pr_base_fail_check.py
          --base-sha "$BASE_SHA"
          --head-sha "$GITHUB_SHA"
          --changed-files changed-files.nul
          --summary-file "$GITHUB_STEP_SUMMARY"
